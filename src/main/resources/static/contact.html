<div class="booking-container">
    <div class="booking-header">
        <h1><i class="fas fa-address-book"></i><em>  Contact Us ~</em> </h1>
        <p><em>Have questions? We're here to help you 24/7.</em></p>
    </div>

    <div class="contact-info" style="display: flex; gap: 20px; margin-top: 20px; color: #333;">
        <div class="info-box" style="flex: 1; padding: 15px; background: #e1e7ec; border-radius: 8px;">
            <i class="fas fa-phone-alt" style="color: #0A2558;"></i>
            <strong>Phone</strong>
            <p>+91 9876543210</p>
        </div>
        <div class="info-box" style="flex: 1; padding: 15px; background: #e1e7ec; border-radius: 8px;">
            <i class="fas fa-envelope" style="color: #0A2558;"></i>
            <strong>Email</strong>
            <p>support@grandstay.com</p>
        </div>
    </div>

    <form id="contactForm" class="booking-form" style="margin-top: 30px;">
        <div class="input-box">
            <label>Subject</label>
            <input type="text" placeholder="Reservation Inquiry" required>
        </div>
        <div class="input-box">
            <label>Message</label>
            <textarea style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; min-height: 100px;" placeholder="How can we help you?" required></textarea>
        </div>
        <button type="submit" class="btn-book">Send Message</button>
    </form>
</div>
