<!DOCTYPE html>

<head>

    <title>Hotel Management | Dashboard</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<script>
(function() {
    // Check if the login flag exists in the browser[cite: 7]
    const authStatus = localStorage.getItem("isLoggedIn");

    if (authStatus !== "true") {
        // If not logged in, redirect them back to the login page immediately[cite: 8]
        alert("Access Denied! Please login or register first.");
        window.location.href = "login.html";
    }
})();
</script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
    const isLoggedIn = localStorage.getItem("isLoggedIn");
    
    if (!isLoggedIn) {
        // If no login data is found, send them back to login page[cite: 7, 8]
        alert("Please login first!");
        window.location.href = "login.html";
    }
});

document.addEventListener("DOMContentLoaded", () => {
    const username = localStorage.getItem("username"); // Checks for "username" in storage[cite: 5, 6]
    const nameField = document.querySelector(".admin_name"); // Looks for class ".admin_name"[cite: 5]

    if (username && nameField) {
        nameField.innerText = "Welcome, " + username; // Injects the name[cite: 5]
    }
});
</script>

<body>
