<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Grand Stay | Login</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
</head>
<div id="successNotify" class="success-popup">Operation Successful!</div>
<body>
    <section>
        <div class="login-box">
            <form id="loginForm">
                <h2 id="loginTitle">Customer Login</h2>
                
                <div class="role-selection" style="text-align: center; margin-bottom: 20px;">
                    <select id="userRole" name="role" onchange="updateLoginUI()" style="padding: 5px; border-radius: 5px; background: transparent; color: #fff;">
                        <option value="customer" style="color: #000;">Customer</option>
                        <option value="admin" style="color: #000;">Administrator</option>
                    </select>
                </div>

                <div class="input-check">
                    <input type="username" id="username" name="username" required>
                    <label>Username</label>
                </div>
                <div class="input-check">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    <input type="password" id="password" name="password" required>
                    <label>Password</label>
                </div>
                <div class="forget">
                    <label><input type="checkbox"> Remember Me</label>
                    <a href="#">Forget Password?</a>
                </div>
                <button type="submit">Log In</button>
                <div class="register" id="registerLink">
                    <p>Don't have an account? <a href="register.html">Register</a></p>
                </div>
            </form>
        </div>
    </section>

    <script>
        function updateLoginUI() {
            const role = document.getElementById("userRole").value;
            const title = document.getElementById("loginTitle");
            const registerLink = document.getElementById("registerLink");
            
            if (role === "admin") {
                title.innerText = "Admin Login";
                registerLink.style.visibility = "hidden"; // Admins usually can't self-register
            } else {
                title.innerText = "Customer Login";
                registerLink.style.visibility = "visible";
            }
        }

    <script src="script.js"></script>
</body>
</html>
